<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>할리갈리 스쿨 | 2인 대결</title>
<style>
:root{--ink:#18243a;--cream:#fff8e9;--blue:#3678f6;--red:#f25358;--gold:#ffca3a;--green:#26a96b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:radial-gradient(circle at top,#fff7d7,#f4e7ca 70%,#e9d5b2);color:var(--ink);height:100vh;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding:clamp(10px,2vw,26px);gap:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:clamp(20px,2.4vw,34px);font-weight:1000;letter-spacing:-1px}.brand span{color:#f5a623}.controls{display:flex;gap:8px}.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:800;font-size:clamp(13px,1.3vw,18px);cursor:pointer;background:#fff;box-shadow:0 3px 0 #d6c5a4;color:var(--ink)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d6c5a4}.btn.primary{background:var(--ink);color:white;box-shadow:0 3px 0 #0d1422}.board{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(170px,22%) 1fr;gap:clamp(8px,1.5vw,18px)}.player{border-radius:26px;padding:clamp(10px,1.8vw,22px);display:flex;flex-direction:column;min-height:0;box-shadow:0 8px 20px #59451b22;border:3px solid #ffffffaa}.player.blue{background:linear-gradient(145deg,#dbeaff,#a8c9ff);border-color:#7eafff}.player.red{background:linear-gradient(145deg,#ffe1df,#ffb8b3);border-color:#ff8d87}.phead{display:flex;justify-content:space-between;align-items:center;gap:8px}.name{font-size:clamp(20px,2vw,30px);font-weight:1000}.blue .name{color:#1753ba}.red .name{color:#ba343b}.count{font-size:clamp(13px,1.4vw,18px);font-weight:800;background:#ffffffa8;border-radius:12px;padding:7px 12px}.pile{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}.card{width:min(76%,260px);aspect-ratio:3/4;background:#fff;border:5px solid white;border-radius:22px;box-shadow:0 8px 0 #0002,0 14px 28px #0002;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;position:relative;cursor:pointer;transition:transform .16s}.card:hover{transform:translateY(-3px) rotate(-1deg)}.card.back{background:repeating-linear-gradient(45deg,#fff5d5,#fff5d5 8px,#f8d879 8px,#f8d879 16px);border-color:#fff;outline:5px solid #f0b93e}.back .pattern{font-size:clamp(45px,6vw,90px);filter:drop-shadow(0 2px 0 #a66b13)}.fruitgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:90%;justify-items:center;align-items:center}.fruit{font-size:clamp(28px,4.3vw,66px);line-height:1;filter:drop-shadow(0 2px 0 #0001)}.cardlabel{position:absolute;bottom:8px;font-size:clamp(9px,.8vw,12px);font-weight:800;color:#8b8b8b}.taphelp{font-weight:800;font-size:clamp(12px,1.3vw,16px);opacity:.7;text-align:center;padding-bottom:6px}.middle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.turn{background:#fff9;border-radius:999px;padding:9px 14px;font-weight:900;text-align:center;font-size:clamp(12px,1.3vw,17px)}.bell{width:min(100%,190px);aspect-ratio:1;border-radius:50%;border:8px solid #e4a51e;background:radial-gradient(circle at 35% 25%,#fff7b5,#ffcc38 48%,#e99b11 80%);box-shadow:0 12px 0 #a76b0b,0 16px 24px #0003;display:flex;align-items:center;justify-content:center;font-size:clamp(52px,7vw,100px);cursor:pointer;user-select:none;transition:transform .1s;touch-action:manipulation}.bell:active{transform:scale(.94)}.bell.disabled{filter:grayscale(.5);opacity:.6;pointer-events:none}.belltext{font-weight:1000;font-size:clamp(14px,1.5vw,20px);text-align:center}.status{background:#fff9;border-radius:16px;padding:12px;text-align:center;min-height:66px;width:100%;font-weight:800;font-size:clamp(12px,1.3vw,16px);display:flex;align-items:center;justify-content:center}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:800;opacity:.8}.overlay{position:fixed;inset:0;background:#172338bb;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal{background:var(--cream);border-radius:28px;padding:30px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 50px #0004}.modal h2{font-size:clamp(26px,4vw,44px);margin:0 0 12px}.modal p{font-size:18px;line-height:1.6}.modal .btn{margin:6px}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;background:#18243a;color:#fff;padding:22px 34px;border-radius:22px;font-weight:1000;font-size:clamp(20px,3vw,38px);z-index:4;transition:.18s;text-align:center}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(max-width:700px){.app{padding:8px}.board{grid-template-columns:1fr 92px 1fr}.player{padding:8px;border-radius:16px}.middle{gap:8px}.bell{width:86px;border-width:5px}.card{width:94%;border-radius:14px;border-width:3px}.count{padding:5px 8px}.phead{flex-direction:column;align-items:flex-start}.name{font-size:16px}.turn{padding:7px;font-size:11px}.status{padding:6px;min-height:56px}.stats{font-size:10px}.controls .btn{padding:8px 10px}.brand{font-size:20px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">🍓 HALI <span>GALLI</span> SCHOOL</div><div class="controls"><button class="btn" id="soundBtn">🔔 효과음 ON</button><button class="btn" id="musicBtn">🎵 음악 ON</button><button class="btn" id="rulesBtn">📖 규칙</button><button class="btn primary" id="restartBtn">↻ 새 게임</button></div></header>
<main class="board">
<section class="player blue" id="p0"><div class="phead"><div class="name">🔵 플레이어 1</div><div class="count" id="count0">카드 28장</div></div><div class="pile" id="pile0"></div><div class="taphelp">카드 영역을 눌러 공개</div></section>
<div class="middle"><div class="turn" id="turn">플레이어 1 차례</div><div class="bell" id="bell" role="button" aria-label="종 치기">🔔</div><div class="belltext">같은 과일 5개면 종!</div><div style="display:flex;gap:6px;width:100%"><button class="btn" style="flex:1;background:#dbeaff" id="ring0">🔵 P1 종</button><button class="btn" style="flex:1;background:#ffe1df" id="ring1">🔴 P2 종</button></div><div class="status" id="status">플레이어 1부터 카드를 공개하세요.</div><div class="stats" id="stats">정답 종 0 · 오답 종 0</div></div>
<section class="player red" id="p1"><div class="phead"><div class="name">🔴 플레이어 2</div><div class="count" id="count1">카드 28장</div></div><div class="pile" id="pile1"></div><div class="taphelp">카드 영역을 눌러 공개</div></section>
</main></div>
<div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
(()=>{
const fruits=[{id:'banana',emoji:'🍌',name:'바나나'},{id:'strawberry',emoji:'🍓',name:'딸기'},{id:'lime',emoji:'🍋',name:'라임'},{id:'plum',emoji:'',name:'자두'}];
let players,turn,locked,correctRings,wrongRings,sound=true,musicOn=true,toastTimer,audioCtx,musicTimer,musicStep=0;
const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,987.77,880,783.99,659.25,587.33];
function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,dur=.12,type='triangle',vol=.035,when=0,isMusic=false){if(!sound&&!isMusic)return;let ctx=audio();let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime+when);g.gain.setValueAtTime(.0001,ctx.currentTime+when);g.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+when+.008);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+when+dur);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+when);o.stop(ctx.currentTime+when+dur+.02)}
function startMusic(){if(!musicOn||musicTimer)return;audio();musicStep=0;musicTimer=setInterval(()=>{if(!musicOn)return;let ctx=audio(),t=ctx.currentTime;let n=musicStep%melody.length; tone(melody[n],.105,'sawtooth',.018,0,true); if(musicStep%4===0)tone([130.81,146.83,110,123.47][Math.floor(musicStep/4)%4],.19,'triangle',.045,0,true);if(musicStep%2===0)tone(65.41,.12,'sine',.055,0,true);musicStep++},110)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function bellSound(){if(!sound)return;let ctx=audio(),t=ctx.currentTime;[880,1320,1760,2200].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime([.16,.09,.045,.025][i],t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+1.25);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.3)});let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(430,t+.25);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.48)}
const $=id=>document.getElementById(id);
function makeDeck(){let deck=[];fruits.forEach(f=>{[1,1,1,1,1,2,2,2,3,3,3,4,4,5].forEach(n=>deck.push({fruit:f.id,count:n}))});for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}return deck}
function init(){let deck=makeDeck();players=[{draw:deck.slice(0,28),visible:[],name:'플레이어 1'},{draw:deck.slice(28),visible:[],name:'플레이어 2'}];turn=0;locked=false;correctRings=0;wrongRings=0;render();setStatus('플레이어 1부터 카드를 공개하세요.');$('overlay').style.display='none'}
function topCard(p){return p.visible.length?p.visible[p.visible.length-1]:null}
function counts(){let sums={};players.forEach(p=>{let c=topCard(p);if(c)sums[c.fruit]=(sums[c.fruit]||0)+c.count});return sums}
function five(){return Object.entries(counts()).filter(([k,v])=>v===5)}
function render(){players.forEach((p,i)=>{let pile=$('pile'+i),c=topCard(p);$('count'+i).textContent=`보유 ${p.draw.length+p.visible.length}장`; pile.innerHTML='';if(!c){pile.innerHTML=`<div class="card back"><div class="pattern">${p.draw.length===0?'🏁':'🍎'}</div><div class="cardlabel">${p.draw.length===0?'카드 없음':'카드 공개'}</div></div>`;return}let f=fruits.find(x=>x.id===c.fruit);let card=document.createElement('div');card.className='card';let grid=document.createElement('div');grid.className='fruitgrid';for(let j=0;j<c.count;j++){let span=document.createElement('span');span.className='fruit';if(f.id==='plum'){span.innerHTML=`<svg viewBox="0 0 64 64" width="1em" height="1em" aria-label="자두"><path d="M33 13 C35 6 43 6 48 8" stroke="#76502a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M34 12 C43 5 52 8 55 15 C47 17 40 16 34 12Z" fill="#68b82d"/><path d="M31 13 C17 10 7 23 8 37 C7 51 18 59 31 59 C45 60 56 49 56 36 C56 23 45 13 31 13Z" fill="#7434a8" stroke="#50227b" stroke-width="2"/><path d="M17 27 C22 19 31 17 37 20" stroke="#b68ae1" stroke-width="4" fill="none" stroke-linecap="round" opacity=".65"/></svg>`;}else{span.textContent=f.emoji;}grid.appendChild(span)}card.appendChild(grid);let label=document.createElement('div');label.className='cardlabel';label.textContent=`${f.name} ${c.count}개`;card.appendChild(label);pile.appendChild(card)});$('turn').textContent=locked?'종 판정 중':`${players[turn].name} 차례`;$('bell').classList.toggle('disabled',locked);$('ring0').disabled=locked;$('ring1').disabled=locked;$('stats').textContent=`정답 종 ${correctRings} · 오답 종 ${wrongRings}`}
function setStatus(t){$('status').textContent=t}
function showToast(text){let t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1100)}
function beep(ok=true){if(!sound)return;if(ok)bellSound();else{tone(190,.24,'sawtooth',.08);tone(120,.25,'triangle',.06,.04)}}
function reveal(i){if(locked)return;if(musicOn)startMusic();if(i!==turn){setStatus(`${players[turn].name} 차례입니다.`);return}if(!players[i].draw.length){checkEnd();return}players[i].visible.push(players[i].draw.shift());turn=1-turn;render();let matches=five();if(matches.length)setStatus(`🚨 ${matches.map(([id])=>fruits.find(f=>f.id===id).name).join(', ')} 합계가 5개! 종을 치세요!`);else setStatus('카드를 공개했습니다. 같은 과일 합계가 정확히 5개인지 확인하세요.');checkEnd()}
function ring(i){if(locked)return;locked=true;render();let match=five();if(match.length){correctRings++;let winner=i;let gathered=players[0].visible.concat(players[1].visible);players[winner].draw.push(...gathered);players[0].visible=[];players[1].visible=[];beep(true);showToast(`정답! ${players[winner].name} 카드 획득 🎉`);setStatus(`${players[winner].name} 정답! 공개된 카드 ${gathered.length}장을 가져갑니다.`)}else{wrongRings++;let offender=i; // penalty is applied to the player who rang
let penalty=players[offender].draw.pop();if(penalty)players[1-offender].draw.push(penalty);beep(false);showToast('오답! 카드 1장 벌칙 😵');setStatus(`${players[offender].name} 오답! 카드 1장을 상대에게 줍니다.`)}render();setTimeout(()=>{locked=false;render();checkEnd()},800)}
function checkEnd(){if(players.some(p=>p.draw.length===0&&p.visible.length===0)){locked=true;let a=players[0].draw.length+players[0].visible.length,b=players[1].draw.length+players[1].visible.length;let winner=a===b?'무승부':a>b?players[0].name:players[1].name;setTimeout(()=>showEnd(winner,a,b),250);return true}return false}
function showEnd(w,a,b){ $('overlay').style.display='flex';$('modal').innerHTML=`<h2>🏆 게임 종료!</h2><p>${w==='무승부'?'두 플레이어가 동률입니다!':`${w} 승리!`}</p><p>🔵 플레이어 1: ${a}장 &nbsp; 🔴 플레이어 2: ${b}장</p><p>정답 종 ${correctRings}회 · 오답 종 ${wrongRings}회</p><button class="btn primary" id="modalRestart">다시 하기</button><button class="btn" id="modalClose">닫기</button>`;$('modalRestart').onclick=init;$('modalClose').onclick=()=> $('overlay').style.display='none'}
$('pile0').addEventListener('click',()=>reveal(0));$('pile1').addEventListener('click',()=>reveal(1));$('bell').addEventListener('click',()=>setStatus('종을 치려면 본인의 🔵 P1 / 🔴 P2 종 버튼을 누르세요.'));$('ring0').addEventListener('click',()=>ring(0));$('ring1').addEventListener('click',()=>ring(1));$('restartBtn').onclick=()=>{if(confirm('새 게임을 시작할까요?'))init()};$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔔 효과음 ON':'🔕 효과음 OFF'};
$('musicBtn').onclick=()=>{musicOn=!musicOn;$('musicBtn').textContent=musicOn?'🎵 음악 ON':'🎵 음악 OFF';if(musicOn){startMusic()}else stopMusic()};
$('rulesBtn').onclick=()=>{$('overlay').style.display='flex';$('modal').innerHTML=`<h2>📖 할리갈리 규칙</h2><p>두 플레이어가 번갈아 자기 카드 더미를 눌러 한 장씩 공개합니다. 현재 공개된 양쪽 카드에서 <b>같은 과일 종류의 합이 정확히 5개</b>가 되면 종을 치세요.</p><p>정답이면 공개된 카드들을 모두 가져가 자신의 카드 더미 아래에 넣습니다. 잘못 종을 치면 카드 1장을 상대에게 줍니다. 카드가 떨어지면 게임이 종료되며, 남은 카드가 많은 플레이어가 승리합니다.</p><p style="font-size:13px;color:#777">이 버전은 수업용 간편 규칙입니다. 카드 소진 및 종료 처리 방식은 정식 규칙과 차이가 있을 수 있습니다.</p><button class="btn primary" id="closeRules">확인</button>`;$('closeRules').onclick=()=> $('overlay').style.display='none'};
init();
})();
</script></body></html>
